<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1224" viewBox="0 0 1600 1224" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H5</title><rect width="1600" height="1224" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">05</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Preprečevanje napak</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Error Prevention</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Dobra sporočila o napakah so pomembna, najboljši dizajni pa napake preprečijo: odpravijo pogoje zanje ali jih preverijo in uporabniku pred</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">potrditvijo ponudijo možnost potrditve.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn preprečuje zdrse s pomočjo ustreznih omejitev?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn uporabnika opozori pred tveganimi dejanji?</text><rect x="80" y="443.5" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Obrazci preverjajo osnovne vnose, izbirnik datotek omeji končnice na .xlsx in .csv. Največja težava je, da nalaganje 15-minutnega izpiska</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">zahteva vnaprej nastavljene dogovorjene moči, kar uporabnik izve šele po kliku na gumb. Pri registraciji pravila za geslo niso vidna vnaprej.</text><text x="80" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="590.8" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="616.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="616.8" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="665.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem opozori na predpogoje, preden uporabnik začne?</text><text x="92" y="693.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pri 15-minutnem izpisku se šele po oddaji pokaže »Najprej nastavi dogovorjene</text><text x="92" y="716.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">moči v razdelku Moj profil!«.</text><text x="824" y="636.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ob odprtju zavihka preveriti dogovorjene moči; če manjkajo, prikazati opozorilo s</text><text x="824" y="660.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">povezavo na profil in onemogočiti nalaganje.</text><rect x="80" y="745.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="745.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="757.4" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="773.4" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="757.4" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="773.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="806.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so pravila za vnos vidna pred oddajo?</text><text x="92" y="833.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pravila za geslo (6 znakov, številka, simbol) se pri registraciji pokažejo eno po eno</text><text x="92" y="856.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">šele ob napaki. Profil ima merilnik moči gesla, registracija ne.</text><text x="824" y="777.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pravila izpisati pod poljem in jih sproti obkljukati; dodati enak merilnik moči kot v</text><text x="824" y="800.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">profilu.</text><rect x="80" y="886.1" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="886.1" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="898.1" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="914.1" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="898.1" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="914.1" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="947.1" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali vnosna polja uporabljajo ustrezne tipe?</text><text x="92" y="974.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Polje za e-pošto je tipa text; preverja se le prisotnost znaka @.</text><text x="824" y="918.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uporabiti type=&quot;email&quot; in autocomplete=&quot;email&quot;; dodati preverjanje oblike.</text><rect x="80" y="1003.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1003.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1015.5" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="1031.5" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="1015.5" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="1031.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="1064.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem prepozna napačno vrsto datoteke?</text><text x="92" y="1091.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Če uporabnik 15-minutni izpisek naloži v zavihek za dnevna stanja (ali obratno),</text><text x="92" y="1115.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">dobi le splošno napako.</text><text x="824" y="1035.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Na zaledju preveriti glavo datoteke in vrniti sporočilo »To je 15-minutni izpisek –</text><text x="824" y="1058.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">naložite ga v zavihek 15-minutni izpisek.«</text></svg>