<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1314" viewBox="0 0 1600 1314" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H1</title><rect width="1600" height="1314" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">01</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Vidnost stanja sistema</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Visibility of System Status</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Sistem mora uporabnika vedno obveščati o tem, kaj se dogaja, z ustrezno povratno informacijo v razumnem času.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn jasno sporoča svoje stanje?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je povratna informacija prikazana hitro po uporabnikovem dejanju?</text><rect x="80" y="415.9" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Aplikacija pri nalaganju datotek prikaže animacijo, vrstico napredka in menjajoča se sporočila, kar je dobra osnova. Napredek pa je</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">navidezen: vrednosti 10, 25, 70 in 90 % so vnaprej določene, nato vrstica lahko do pet minut stoji pri 90 %. Pri prijavi in potrditvi kode 2FA povratne informacije</text><text x="104" y="500.2" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">o tem, da sistem dela, ni, kar je pri prijavi posebej moteče, saj se zaledni strežnik ob prvem zahtevku prebuja okoli 15 sekund.</text><text x="80" y="571.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="571.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="587.9" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="601.9" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="601.9" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="613.9" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="629.9" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="613.9" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="174.56875" y="629.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="662.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem med nalaganjem datoteke prikazuje napredek?</text><text x="92" y="690.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Odstotki napredka so umetni (fiksne vrednosti), sporočila se menjajo na 8 s ne</text><text x="92" y="713.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">glede na dejansko stanje, pri 90 % pa lahko obdelava stoji več minut brez</text><text x="92" y="736.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">spremembe.</text><text x="824" y="633.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uporabiti nedoločen indikator s prikazom dejanske faze (prenos, obdelava, zapis)</text><text x="824" y="657.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">in pretečenega časa; ob dolgi obdelavi uporabnika obvestiti, da lahko stran zapusti</text><text x="824" y="680.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">in bo obveščen ob zaključku.</text><rect x="80" y="765.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="765.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="777.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="793.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="777.8" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="793.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="826.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali ima gumb za prijavo stanje nalaganja?</text><text x="92" y="854.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Registracija ima stanje »Pošiljanje …«, prijava in potrditev kode 2FA pa ne. Po kliku</text><text x="92" y="877.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">na »Prijava« se lahko do 15 s (prebujanje strežnika) ne zgodi nič, uporabnik je v</text><text x="92" y="900.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Firebase že prijavljen, a ostane na prijavni strani.</text><text x="824" y="797.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Med zahtevkom prikazati »Prijavljam …« na onemogočenem gumbu, po nekaj</text><text x="824" y="821.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">sekundah dodati pojasnilo, da se strežnik prebuja, in preusmeriti takoj, ko je</text><text x="824" y="844.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uporabnik prijavljen.</text><rect x="80" y="929.6" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="929.6" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="941.6" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="957.6" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="941.6" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="957.6" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="990.6" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali uporabnik vidi, na kateri strani se nahaja?</text><text x="92" y="1017.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Na namizju je aktivni element v stranski vrstici obarvan. Glava strani ne prikazuje</text><text x="92" y="1041.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">naslova ali drobtinic, na mobilni napravi pa je meni skrit, zato je lokacija razvidna</text><text x="92" y="1064.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">le iz vsebine.</text><text x="824" y="961.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">V glavo dodati naslov trenutne strani (ali drobtinice), aktivno stanje ohraniti tudi v</text><text x="824" y="984.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">mobilnem meniju.</text><rect x="80" y="1093.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1093.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1105.5" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="1121.5" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="1154.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem potrdi uspešno opravljeno dejanje?</text><text x="92" y="1181.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Po uspešnem nalaganju se izpiše zeleno sporočilo »Podatki uspešno naloženi ali</text><text x="92" y="1204.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">posodobljeni.«</text><text x="824" y="1125.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text></svg>