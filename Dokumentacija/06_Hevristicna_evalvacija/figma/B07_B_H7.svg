<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1056" viewBox="0 0 1600 1056" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H7</title><rect width="1600" height="1056" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">07</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Prilagodljivost in učinkovitost uporabe</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Flexibility and Efficiency of Use</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Bližnjice, skrite pred začetniki, pospešijo delo izkušenih uporabnikov, tako da dizajn ustreza obojim. Uporabnik naj pogosta dejanja prilagodi sebi.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ponuja pospeševalnike, kot so bližnjične tipke in kretnje?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali sta vsebina in funkcionalnost prilagojeni posameznemu uporabniku?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Analitični pogledi ne ponujajo veliko bližnjic: Razlaga računa ob odprtju nima izbranega obdobja, simulacija pa ne omogoča vnosa lastne</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">naprave ali števila naprav.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="589.2" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem predizbere smiselne privzete vrednosti?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Razlaga računa se odpre s praznima izbirnikoma, čeprav ima uporabnik vnesene</text><text x="92" y="688.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">račune.</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Privzeto izbrati zadnji vneseni mesec.</text><rect x="80" y="717.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="717.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="729.9" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="729.9" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="778.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali lahko napreden uporabnik prilagodi izračun?</text><text x="92" y="806.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Simulacija pozna le 12 vnaprej določenih naprav s fiksno močjo; ni mogoče</text><text x="92" y="829.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">nastaviti števila, lastne moči ali ure.</text><text x="824" y="749.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati vnos lastne naprave, število kosov in izbiro ure ter dneva.</text><rect x="80" y="858.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="858.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="870.5" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="886.5" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="870.5" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="886.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="919.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je mogoče rezultate izvoziti?</text><text x="92" y="946.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Grafov in tabel ni mogoče izvoziti.</text><text x="824" y="890.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati izvoz v PDF ali CSV.</text></svg>