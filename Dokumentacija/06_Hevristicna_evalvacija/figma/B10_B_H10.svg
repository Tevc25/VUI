<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1009" viewBox="0 0 1600 1009" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H10</title><rect width="1600" height="1009" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">10</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Pomoč in dokumentacija</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Help and Documentation</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Najbolje je, če sistem ne potrebuje dodatne razlage. Kljub temu je lahko potrebna dokumentacija, ki uporabniku pomaga dokončati naloge.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je dokumentacijo pomoči lahko preiskati?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je pomoč na voljo v kontekstu, ravno ko jo uporabnik potrebuje?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Harmonike »Kaj pomeni obračunska moč?«, »Priporočilo za nižje stroške« in razlage postavk računa so dober primer pomoči v kontekstu.</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Manjka pa pomoč tam, kjer jo uporabnik najbolj potrebuje: pri vnosu dogovorjenih moči v profilu in pri nastavitvi 2FA.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je pomoč na voljo v kontekstu naloge?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Harmonike na straneh Simulacija in Omrežnina ter razlage v Razlagi računa.</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text><rect x="80" y="694.7" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="694.7" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="706.7" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="706.7" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="755.7" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali uporabnik ve, kje najde vrednosti dogovorjenih moči?</text><text x="92" y="783.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">V profilu ni navodila; navodilo s slikami je le na strani simulacije.</text><text x="824" y="726.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Isto harmoniko z navodili za mojelektro.si dodati v razdelek »Dogovorjene moči«.</text><rect x="80" y="812.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="812.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="824.2" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="840.2" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="824.2" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="840.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="873.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je postopek 2FA razložen?</text><text x="92" y="900.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prikazana sta žeton in koda QR, brez korakov.</text><text x="824" y="844.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati 3 korake (namesti aplikacijo, skeniraj, vnesi kodo).</text></svg>