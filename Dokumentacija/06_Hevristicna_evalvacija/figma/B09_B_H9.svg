<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1079" viewBox="0 0 1600 1079" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H9</title><rect width="1600" height="1079" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">09</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Pomoč uporabnikom pri prepoznavanju, diagnozi in odpravi napak</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Help Users Recognize, Diagnose, and Recover from Errors</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Sporočila o napakah naj bodo v preprostem jeziku (brez kod napak), naj natančno opišejo težavo in konstruktivno predlagajo rešitev.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn uporablja običajne vizualne oznake napak (npr. krepko, rdeče besedilo)?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ponudi rešitev, ki napako takoj odpravi?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Napake v profilu in pri ročnem vnosu računa so splošne ali tehnične. Sporočilo pri spremembi gesla (»napačno trenutno geslo ali drug</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">problem«) ne loči vzrokov, poleg tega se zaradi napake iz H1 sploh ne prikaže. Ročni vnos računa uporablja alert s tehničnim besedilom.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="589.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sporočilo loči različne vzroke?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">»Napaka: napačno trenutno geslo ali drug problem.«</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ločiti napačno geslo, prešibko geslo in omrežno napako.</text><rect x="80" y="694.7" width="708" height="175.1" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="694.7" width="708" height="175.1" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="706.7" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="706.7" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="755.7" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so sporočila razumljiva laiku?</text><text x="92" y="783.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ročni vnos računa ob napaki odpre brskalnikovo okno alert z besedilom »Napaka:</text><text x="92" y="806.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">UID ni na voljo.«; nalaganje 15-minutnega izpiska izpiše »Napaka: uporabnik ni</text><text x="92" y="829.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">prijavljen.«, če je bila ob prijavi izbrana možnost »Zapomni si napravo« (UID se</text><text x="92" y="852.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">bere le iz sessionStorage), čeprav je uporabnik prijavljen.</text><text x="824" y="726.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Napake preslikati v razumljiva besedila (vzrok + naslednji korak) in jih prikazati v</text><text x="824" y="749.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">aplikaciji, ne z alert.</text><rect x="80" y="881.8" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="881.8" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="893.8" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="909.8" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="893.8" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="909.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="942.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sporočilo pri brisanju pove vzrok?</text><text x="92" y="970.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">»Napaka pri brisanju.«</text><text x="824" y="913.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati vzrok in predlog (»Preverite povezavo in poskusite znova«).</text></svg>