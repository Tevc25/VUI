<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1388" viewBox="0 0 1600 1388" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H5</title><rect width="1600" height="1388" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">05</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Preprečevanje napak</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Error Prevention</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Dobra sporočila o napakah so pomembna, najboljši dizajni pa napake preprečijo: odpravijo pogoje zanje ali jih preverijo in uporabniku pred</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">potrditvijo ponudijo možnost potrditve.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn preprečuje zdrse s pomočjo ustreznih omejitev?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn uporabnika opozori pred tveganimi dejanji?</text><rect x="80" y="443.5" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Dogovorjene moči se preverjajo le glede padajočega vrstnega reda blokov, polja pa sprejmejo poljuben tekst, ki se tiho shrani kot 0.</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Podobno velja za toplotno črpalko. Najbolj tvegana je vklop 2FA, ki ne zahteva testne kode, zato se lahko uporabnik zaklene iz računa.</text><text x="80" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="590.8" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="604.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="604.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="616.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="616.8" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="665.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so številska polja preverjena?</text><text x="92" y="693.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Vnos »abc« v polje bloka se shrani kot 0 kW. Na testnem računu je moč toplotne</text><text x="92" y="716.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">črpalke shranjena kot 676 kW; simulacija zato brez opozorila pokaže porabo 683,5</text><text x="92" y="739.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">kW in »kazen« 110 € (posnetka 2 in 9).</text><text x="824" y="636.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uporabiti številska polja z mejami (npr. 2–43 kW), napako prikazati ob polju in</text><text x="824" y="660.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">onemogočiti shranjevanje.</text><rect x="80" y="768.6" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="768.6" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="780.6" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="796.6" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="780.6" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="796.6" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="829.6" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem prepreči zaklep pri 2FA?</text><text x="92" y="856.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Gumb »Omogoči dvofaktorsko avtentikacijo« vklopi 2FA brez preverjanja, ali je</text><text x="92" y="880.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uporabnik kodo res skeniral.</text><text x="824" y="800.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pred vklopom zahtevati vnos ene veljavne kode iz aplikacije in ponuditi rezervne</text><text x="824" y="823.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">kode.</text><rect x="80" y="909.3" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="909.3" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="921.3" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="937.3" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="921.3" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="937.3" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="970.3" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so podatki toplotne črpalke preverjeni?</text><text x="92" y="997.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prazno ali neštevilsko polje se shrani kot NaN, nerealne vrednosti (676 kW) so</text><text x="92" y="1020.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">sprejete.</text><text x="824" y="941.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Preveriti obseg (moč 0,5–20 kW, temperatura −25 do 20 °C) in ob sumljivi</text><text x="824" y="964.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">vrednosti vprašati za potrditev.</text><rect x="80" y="1050.0" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1050.0" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1062.0" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="1078.0" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="1062.0" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="1078.0" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="1111.0" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem preveri smiselnost ročno vnesenega računa?</text><text x="92" y="1138.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Račun z »Skupni znesek brez DDV« 10 € in postavkami v skupni vrednosti 51 € je</text><text x="92" y="1161.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">sprejet in prikazan brez opozorila (posnetek 7).</text><text x="824" y="1082.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ob vnosu preveriti, da se postavke ujemajo s skupnim zneskom (dovoljeno</text><text x="824" y="1105.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">odstopanje), ali skupni znesek izračunati samodejno.</text><rect x="80" y="1190.6" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1190.6" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1202.6" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="1218.6" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="1202.6" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="1218.6" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1251.6" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so pravila vnosa pojasnjena vnaprej?</text><text x="92" y="1278.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pravilo, da blok 1 ne sme biti manjši od bloka 2 itd., se pokaže šele ob napaki.</text><text x="824" y="1222.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pravilo izpisati nad polji.</text></svg>