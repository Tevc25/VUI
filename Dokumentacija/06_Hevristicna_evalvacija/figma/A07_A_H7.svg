<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H7</title><rect width="1600" height="1150" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">07</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Prilagodljivost in učinkovitost uporabe</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Flexibility and Efficiency of Use</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Bližnjice, skrite pred začetniki, pospešijo delo izkušenih uporabnikov, tako da dizajn ustreza obojim. Uporabnik naj pogosta dejanja prilagodi sebi.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ponuja pospeševalnike, kot so bližnjične tipke in kretnje?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali sta vsebina in funkcionalnost prilagojeni posameznemu uporabniku?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Za izkušene uporabnike sistem ponuja malo pospeškov: ni povleci in spusti, ni nalaganja več datotek hkrati, nadzorna plošča pa ne</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">prikazuje nobenih podatkov uporabnika, temveč le povezave. Pohvalna je možnost »Zapomni si napravo«.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="589.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali nadzorna plošča omogoča hiter vpogled v ključne podatke?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Nadzorna plošča je zgolj seznam povezav; uporabnik mora za vsak podatek odpreti</text><text x="92" y="688.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">ločeno stran.</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati kartice s ključnimi kazalniki: poraba zadnjega meseca, število prekoračitev,</text><text x="824" y="632.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">trenutni blok, dogovorjene moči.</text><rect x="80" y="717.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="717.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="729.9" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="729.9" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="778.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali nalaganje podpira hitrejše načine dela?</text><text x="92" y="806.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni povleci in spusti, ni nalaganja več datotek naenkrat.</text><text x="824" y="749.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati območje za povleci in spusti ter paketno nalaganje.</text><rect x="80" y="835.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="835.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="847.4" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="863.4" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="847.4" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="863.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="896.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali lahko uporabnik dejanja potrdi s tipkovnico?</text><text x="92" y="923.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prijava se odda z Enter, koda 2FA ne (ni v obrazcu).</text><text x="824" y="867.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Polje za kodo 2FA zaviti v &lt;form&gt;, dodati inputMode=&quot;numeric&quot; in samodejno</text><text x="824" y="890.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">oddajo po 6 števkah.</text><rect x="80" y="952.8" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="952.8" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="964.8" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="980.8" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="1013.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem omogoča ohranitev prijave?</text><text x="92" y="1041.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Možnost »Zapomni si napravo« ob prijavi.</text><text x="824" y="984.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text></svg>