<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1056" viewBox="0 0 1600 1056" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H10</title><rect width="1600" height="1056" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">10</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Pomoč in dokumentacija</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Help and Documentation</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Najbolje je, če sistem ne potrebuje dodatne razlage. Kljub temu je lahko potrebna dokumentacija, ki uporabniku pomaga dokončati naloge.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je dokumentacijo pomoči lahko preiskati?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je pomoč na voljo v kontekstu, ravno ko jo uporabnik potrebuje?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Navodila za izvoz podatkov iz mojelektro.si s posnetki zaslona so zgledna, prav tako vodnik po strani. Manjka pa enotno mesto pomoči</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">(pogosta vprašanja, slovar izrazov) in pomoč pri prvem koraku po registraciji.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali obstajajo navodila za ključna opravila?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Koraki in slike za izvoz dnevnih stanj in 15-minutnih podatkov.</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text><rect x="80" y="694.7" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="694.7" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="706.7" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="706.7" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="722.7" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="755.7" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali obstaja osrednji vir pomoči?</text><text x="92" y="783.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni strani s pogostimi vprašanji ali slovarjem (ET, VT/MT, blok, dogovorjena moč).</text><text x="92" y="806.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dokumentacija GitBook je namenjena razvijalcem in ni povezana iz aplikacije.</text><text x="824" y="726.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati stran »Pomoč« v stransko vrstico s pogostimi vprašanji in slovarjem izrazov.</text><rect x="80" y="835.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="835.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="847.4" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="863.4" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="847.4" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="174.56875" y="863.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="896.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem novega uporabnika usmeri k prvemu koraku?</text><text x="92" y="923.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Po prvi prijavi ni namiga, da je treba najprej vnesti dogovorjene moči in naložiti</text><text x="92" y="946.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">podatke; večina analitičnih strani je prazna.</text><text x="824" y="867.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati kratek vodič ob prvi prijavi (1. dogovorjene moči, 2. nalaganje, 3. analize).</text></svg>