<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1108" viewBox="0 0 1600 1108" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H6</title><rect width="1600" height="1108" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">06</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Prepoznavanje namesto priklica</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Recognition Rather Than Recall</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Zmanjšati je treba obremenitev spomina: elementi, dejanja in možnosti naj bodo vidni. Uporabniku ni treba pomniti informacij iz enega dela</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">vmesnika v drugega.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ohranja pomembne informacije vidne, da si jih uporabnik ne rabi zapomniti?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ponuja pomoč v kontekstu?</text><rect x="80" y="443.5" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Vodnik po strani na nadzorni plošči z opisi vseh funkcij in navodila s posnetki zaslona za mojelektro.si močno zmanjšajo potrebo po</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">pomnjenju. Slabše je, da glava ne prikazuje naslova trenutne strani in da navodila za mojelektro.si niso dosegljiva iz profila, kjer uporabnik vnaša dogovorjene</text><text x="104" y="527.8" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">moči.</text><text x="80" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="615.5" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="629.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="629.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="641.5" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="657.5" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="690.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so funkcije sistema predstavljene vidno?</text><text x="92" y="717.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Vodnik po strani prikaže vse funkcije s kratkim opisom.</text><text x="824" y="661.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text><rect x="80" y="746.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="746.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="758.9" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="774.9" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><rect x="174.2190625" y="758.9" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="186.2190625" y="774.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="807.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so navodila dosegljiva tam, kjer jih uporabnik potrebuje?</text><text x="92" y="835.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pod vsakim obrazcem za nalaganje je harmonika »Kako prenesti izpis iz</text><text x="92" y="858.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">mojelektro.si?« s koraki in slikami.</text><text x="824" y="778.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Harmoniko ob prvem obisku prikazati razprto.</text><rect x="80" y="887.6" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="887.6" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="899.6" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="915.6" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="899.6" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="915.6" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="948.6" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali mora uporabnik pomniti, kje najde potrebne podatke?</text><text x="92" y="975.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Za nalaganje 15-minutnega izpiska so potrebne dogovorjene moči, navodilo, kje jih</text><text x="92" y="999.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">najti, pa je le na strani Simulacija.</text><text x="824" y="919.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Navodilo prikazati tudi v profilu in v opozorilu pri nalaganju.</text></svg>