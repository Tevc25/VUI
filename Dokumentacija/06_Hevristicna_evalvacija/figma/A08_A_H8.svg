<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H8</title><rect width="1600" height="1060" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">08</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Estetski in minimalistični dizajn</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Aesthetic and Minimalist Design</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Vmesnik ne sme vsebovati nepomembnih ali redko potrebnih informacij. Vsaka dodatna informacija tekmuje s pomembnimi in zmanjšuje njihovo</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">vidnost.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali sta vizualni dizajn in vsebina osredotočena na bistveno?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali so odstranjeni vsi moteči in nepotrebni elementi?</text><rect x="80" y="443.5" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Vmesnik je pregleden in sodoben. Nadzorna plošča pa ima pred vsebino veliko praznega prostora (prazni bloki za odmik) in animacijo</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">čez trikratno širino zaslona, zato je vodnik na manjših zaslonih pod pregibom. Uvodna besedila na straneh za nalaganje so dolga.</text><text x="80" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="590.8" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="616.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="616.8" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="665.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je pomembna vsebina vidna brez drsenja?</text><text x="92" y="693.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Na nadzorni plošči so pred vodnikom prazni odmiki (py-12, py-10) in dekorativna</text><text x="92" y="716.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">animacija; kartice so na prenosniku vidne šele po drsenju.</text><text x="824" y="636.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Zmanjšati odmike, animacijo pomanjšati ali odstraniti; ključne kazalnike postaviti</text><text x="824" y="660.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">na vrh.</text><rect x="80" y="745.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="745.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="757.4" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="773.4" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="757.4" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="773.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="806.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali besedila vsebujejo le potrebne informacije?</text><text x="92" y="833.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uvod na strani za nalaganje ima dva dolga stavka, ki ponavljata ime zavihkov.</text><text x="824" y="777.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Skrajšati na en stavek; podrobnosti prestaviti v pomoč.</text><rect x="80" y="862.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="862.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="874.9" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="890.9" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="923.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je vizualna hierarhija jasna?</text><text x="92" y="951.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Kartice, naslovi in primarni gumbi so jasno ločeni.</text><text x="824" y="894.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text></svg>