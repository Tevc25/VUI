<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1318" viewBox="0 0 1600 1318" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H2</title><rect width="1600" height="1318" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">02</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Ujemanje med sistemom in resničnim svetom</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Match Between System and the Real World</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Dizajn naj govori jezik uporabnika: besede, fraze in koncepte, ki jih uporabnik pozna, namesto internega žargona. Sledi naj konvencijam resničnega</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">sveta in informacije prikazuje v naravnem in logičnem zaporedju.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali bo uporabnik poznal uporabljeno terminologijo?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali kontrolniki sledijo konvencijam resničnega sveta?</text><rect x="80" y="443.5" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Razlage računa so pisane razumljivo. Vsebinsko pa simulacija vedno računa z višjo sezono in delovnim dnem, ne glede na dejanski</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">datum, zato so bloki in zneski izven obdobja november–februar napačni. Razlaga postavke »Omrežnina« jo opiše kot fiksni prispevek, neodvisen od porabe, kar</text><text x="104" y="527.8" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">ne drži. V pregledu podatkov se prikazujejo interna imena zbirk iz baze.</text><text x="80" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="615.5" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="629.5" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="629.5" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="641.5" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="657.5" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="641.5" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="657.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="690.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali rezultati ustrezajo dejanskemu stanju?</text><text x="92" y="717.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Simulacija ima sezono (VISJA) in tip dneva (DELOVNI_DAN) zapisana v kodi. Ob</text><text x="92" y="740.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">testu 13. 10. ob 17. uri je simulacija prikazala blok 3, stran Omrežnina pa je za isto</text><text x="92" y="764.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uro pravilno označila blok 2 (posnetka 2 in 3).</text><text x="824" y="661.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Sezono in tip dneva določiti iz trenutnega datuma (ali iz zalednega klica za trenutni</text><text x="824" y="684.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">blok) in uporabniku omogočiti ročno izbiro.</text><rect x="80" y="793.3" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="793.3" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="805.3" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="821.3" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="805.3" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="821.3" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="854.3" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so strokovne razlage točne?</text><text x="92" y="881.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Razlaga »Omrežnina: fiksni prispevek …, ki je neodvisen od količine porabljene</text><text x="92" y="904.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">energije« je zavajajoča, saj je omrežnina sestavljena iz dela za moč in dela za</text><text x="92" y="928.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">energijo.</text><text x="824" y="825.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Besedilo uskladiti z razlago URO (del za obračunsko moč po blokih + del za</text><text x="824" y="848.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">prevzeto energijo) in dodati povezavo na vir.</text><rect x="80" y="957.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="957.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="969.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="985.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="969.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="985.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="1018.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so prikazani podatki v jeziku uporabnika?</text><text x="92" y="1045.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izbirnik »Izberi tip podatkov« prikazuje interna imena: poraba, prekoracitve,</text><text x="92" y="1068.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">optimum, racuni (brez šumnikov); meseci so prikazani kot »04«.</text><text x="824" y="989.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Preslikati v opisna imena (»Dnevna poraba«, »Prekoračitve moči«, »Optimalna</text><text x="824" y="1012.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">moč«, »Ročno vneseni računi«) in mesece v imena.</text><rect x="80" y="1097.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1097.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1109.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="1125.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="1109.8" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="1125.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1158.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali ikone ustrezajo pomenu?</text><text x="92" y="1186.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Na časovnici blokov je ob 0. uri ikona sonca, ob 23. uri pa luna, čeprav sta obe uri</text><text x="92" y="1209.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">ponoči.</text><text x="824" y="1129.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Sonce postaviti k jutranjim uram (npr. 6–7), luno k nočnim, ali ikoni odstraniti.</text></svg>