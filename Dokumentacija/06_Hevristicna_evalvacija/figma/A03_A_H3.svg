<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H3</title><rect width="1600" height="1260" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">03</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Uporabnikov nadzor in svoboda</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">User Control and Freedom</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Uporabniki pogosto izvedejo dejanje po pomoti. Potrebujejo jasno označen »izhod v sili«, s katerim neželeno dejanje zapustijo brez dolgega</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">postopka.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali lahko uporabnik naredi korak nazaj?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali so izhodne povezave lahko opazne?</text><circle cx="86" cy="436.5" r="4" fill="#4F4FC9"/><text x="102" y="441.5" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali lahko uporabnik dejanje enostavno prekliče?</text><circle cx="86" cy="465.7" r="4" fill="#4F4FC9"/><text x="102" y="470.7" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali sta podprta Razveljavi in Ponovi?</text><rect x="80" y="501.9" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="536.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Uporabnik se iz večine pogledov preprosto vrne prek stranske vrstice, odjava je takojšnja. Manjka pa možnost preklica že začete</text><text x="104" y="561.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">obdelave datoteke, gumb »Nazaj« na strani 404 pa vodi na nadzorno ploščo in ne na prejšnjo stran. Prijavljen uporabnik, ki odpre prijavno stran, ni</text><text x="104" y="586.2" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">preusmerjen v aplikacijo.</text><text x="80" y="657.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="657.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="673.8" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="687.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="687.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="699.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="715.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="699.8" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="715.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="748.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali lahko uporabnik prekliče dolgotrajno operacijo?</text><text x="92" y="776.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Gumb »Prekliči« pri nalaganju le počisti izbrano datoteko. Ko obdelava teče (do 5</text><text x="92" y="799.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">min), preklica ni.</text><text x="824" y="719.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Med obdelavo prikazati gumb »Prekliči obdelavo«, ki ustavi poizvedovanje in po</text><text x="824" y="743.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">potrebi odstrani delno zapisane podatke.</text><rect x="80" y="828.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="828.5" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="840.5" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="856.5" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="840.5" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="856.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="889.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali obstaja jasen izhod iz napačno izbrane poti?</text><text x="92" y="916.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Stran 404 ima gumb »Nazaj«, ki vodi na »/« namesto na prejšnjo stran.</text><text x="824" y="860.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Gumb preimenovati v »Na nadzorno ploščo« ali dodati drugi gumb, ki izvede korak</text><text x="824" y="883.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">nazaj v zgodovini.</text><rect x="80" y="945.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="945.9" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="957.9" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="973.9" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="957.9" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="973.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="1006.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem prepozna, da je uporabnik že prijavljen?</text><text x="92" y="1034.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prijavljen uporabnik, ki odpre /auth/login, ponovno vidi obrazec za prijavo.</text><text x="824" y="977.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Na prijavni strani preveriti stanje prijave in uporabnika preusmeriti na nadzorno</text><text x="824" y="1001.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">ploščo.</text><rect x="80" y="1063.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1063.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1075.4" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="1091.4" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="1124.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali se lahko uporabnik prosto odjavi?</text><text x="92" y="1151.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Odjava je dostopna v meniju profila in deluje takoj.</text><text x="824" y="1095.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text></svg>