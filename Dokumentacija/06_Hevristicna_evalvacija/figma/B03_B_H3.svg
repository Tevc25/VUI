<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1118" viewBox="0 0 1600 1118" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H3</title><rect width="1600" height="1118" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">03</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Uporabnikov nadzor in svoboda</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">User Control and Freedom</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Uporabniki pogosto izvedejo dejanje po pomoti. Potrebujejo jasno označen »izhod v sili«, s katerim neželeno dejanje zapustijo brez dolgega</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">postopka.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali lahko uporabnik naredi korak nazaj?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali so izhodne povezave lahko opazne?</text><circle cx="86" cy="436.5" r="4" fill="#4F4FC9"/><text x="102" y="441.5" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali lahko uporabnik dejanje enostavno prekliče?</text><circle cx="86" cy="465.7" r="4" fill="#4F4FC9"/><text x="102" y="470.7" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali sta podprta Razveljavi in Ponovi?</text><rect x="80" y="501.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="536.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Brisanje podatkov in računa je zaščiteno s potrditvenim oknom, kar je dobro. Ni pa možnosti razveljavitve, okno s podrobnostmi</text><text x="104" y="561.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">podatkov se ne zapre s tipko Esc ali klikom izven njega, izbris računa pa ob zahtevi po ponovni prijavi uporabnika pusti brez poti naprej.</text><text x="80" y="633.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="633.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="649.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="663.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="663.2" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="675.2" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="691.2" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="675.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="174.56875" y="691.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="724.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je mogoče razveljaviti brisanje?</text><text x="92" y="751.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Posamezni zapis in »Izbriši vse« sta potrjena z oknom, razveljavitve pa ni.</text><text x="824" y="695.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Po brisanju prikazati obvestilo z gumbom »Razveljavi« (npr. 10 s) ali uvesti koš.</text><rect x="80" y="780.6" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="780.6" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="792.6" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="808.6" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="792.6" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="808.6" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="841.6" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je zapiranje pojavnih oken intuitivno?</text><text x="92" y="868.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Okno »Podrobnosti« v Pregledu datotek se zapre le s klikom na ×.</text><text x="824" y="812.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati zapiranje s tipko Esc in klikom na ozadje.</text><rect x="80" y="898.1" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="898.1" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="910.1" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="926.1" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="910.1" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="926.1" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="959.1" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali ima uporabnik pot naprej po neuspelem dejanju?</text><text x="92" y="986.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izbris računa zahteva nedavno prijavo; sporočilo »Prijavite se ponovno.« ne ponudi</text><text x="92" y="1009.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">ponovne prijave.</text><text x="824" y="930.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ob napaki odpreti okno za ponovni vnos gesla in nato izbris dokončati.</text></svg>