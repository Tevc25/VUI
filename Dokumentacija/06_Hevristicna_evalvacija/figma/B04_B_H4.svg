<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1244" viewBox="0 0 1600 1244" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H4</title><rect width="1600" height="1244" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">04</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Doslednost in standardi</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Consistency and Standards</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Uporabnik se ne sme spraševati, ali različne besede, situacije ali dejanja pomenijo isto. Upoštevati je treba konvencije platforme in industrije.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn sledi industrijskim konvencijam?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali so vizualni elementi uporabljeni dosledno v celotnem dizajnu?</text><rect x="80" y="415.9" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Pogledi so oblikovno podobni (naslov, uvodno besedilo, izbirniki leta in meseca). Neenotno pa je shranjevanje v profilu: avatar in tarifa</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">se shranita takoj, dogovorjene moči in ime pa šele z gumbom. Ime postavke v meniju se razlikuje od naslova strani, barva bloka 1 v grafih je skoraj enaka barvi</text><text x="104" y="500.2" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">prekoračitev.</text><text x="80" y="571.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="571.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="587.9" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="601.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="601.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="613.9" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="629.9" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="613.9" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="629.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="662.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali se shranjevanje nastavitev obnaša enako?</text><text x="92" y="690.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Avatar in tarifa ET/VT-MT se shranita ob kliku, moči in ime zahtevajo »Shrani«;</text><text x="92" y="713.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uporabnik ne ve, kdaj je sprememba trajna.</text><text x="824" y="633.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Vse nastavitve v razdelku shranjevati z enim gumbom »Shrani« ali vse samodejno</text><text x="824" y="657.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">z jasnim obvestilom.</text><rect x="80" y="742.5" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="742.5" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="754.5" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="770.5" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="754.5" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="770.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="803.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali se ime v meniju ujema z naslovom strani?</text><text x="92" y="830.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Meni: »Statistika moči«, naslov strani: »Statistika porabe«; meni: »Razlaga</text><text x="92" y="854.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">računa«, naslov: »Račun na kratko«; meni: »Pregled datotek«, naslov: »Upravljanje</text><text x="92" y="877.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">podatkov«.</text><text x="824" y="774.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uskladiti poimenovanje.</text><rect x="80" y="906.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="906.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="918.4" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="934.4" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="918.4" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="934.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="967.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so barve uporabljene dosledno in nedvoumno?</text><text x="92" y="994.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">V tortnih grafih Statistike moči je blok 1 obarvan #fa144d, prekoračitev pa rdeče</text><text x="92" y="1017.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">(rgba 255,0,0); bloku 5 barva ni določena.</text><text x="824" y="938.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prekoračitve prikazati z vzorcem ali nevtralno temno barvo, določiti barve za vseh</text><text x="824" y="961.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">5 blokov enako kot na strani Omrežnina.</text><rect x="80" y="1047.0" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1047.0" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1059.0" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="1075.0" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="1059.0" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="1075.0" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1108.0" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so oznake zavihkov smiselne v vseh stanjih?</text><text x="92" y="1135.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Zavihek »Dodaj toplotno črpalko« ostane enak, tudi ko je črpalka že dodana.</text><text x="824" y="1079.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ob obstoječih podatkih prikazati »Toplotna črpalka«.</text></svg>