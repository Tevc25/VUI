<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1433" viewBox="0 0 1600 1433" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H1</title><rect width="1600" height="1433" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">01</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Vidnost stanja sistema</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Visibility of System Status</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Sistem mora uporabnika vedno obveščati o tem, kaj se dogaja, z ustrezno povratno informacijo v razumnem času.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn jasno sporoča svoje stanje?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali je povratna informacija prikazana hitro po uporabnikovem dejanju?</text><rect x="80" y="415.9" width="1440" height="138.6" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Stran Omrežnina dobro označi trenutno uro in sezono, simulacija se samodejno preračuna ob izbiri naprav. Resna težava je, da se v</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">profilu sporočila o uspehu ali napaki pri spremembi imena, avatarja in gesla nikjer ne izpišejo. Poraba po mesecih in Statistika moči pa podatke prikažeta šele</text><text x="104" y="500.2" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">po daljšem nalaganju, med katerim je vidna le gola vrtavka brez pojasnila. Kadar vremenski podatek ni na voljo, simulacija izpiše »zunanja temperatura je</text><text x="104" y="524.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">X°C«.</text><text x="80" y="596.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="596.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="612.5" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="626.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="626.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="638.5" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="654.5" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="638.5" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="654.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="687.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem potrdi spremembo gesla in imena?</text><text x="92" y="714.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Sporočilo (status) se v razdelkih »Uredi profil« in »Spremeni geslo« ne izriše;</text><text x="92" y="738.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uporabnik ne ve, ali je bilo geslo spremenjeno.</text><text x="824" y="658.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Sporočilo izpisati v vsakem razdelku ali uporabiti globalna obvestila (toast).</text><rect x="80" y="767.2" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="767.2" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="779.2" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="795.2" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="779.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="174.56875" y="795.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="828.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem med daljšim nalaganjem podatkov sporoča, kaj se dogaja?</text><text x="92" y="855.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Poraba po mesecih in Statistika moči podatke prikažeta, vendar šele po daljšem</text><text x="92" y="878.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">času (ob testu več kot 10 s). Ves čas je vidna le vrtavka brez besedila, zato</text><text x="92" y="901.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">uporabnik ne ve, ali stran dela ali je obtičala (posnetek 4).</text><text x="824" y="799.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Namesto gole vrtavke prikazati okvir grafov (skeleton) in besedilo »Nalagam</text><text x="824" y="822.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">podatke …«, po nekaj sekundah pa pojasnilo, da se strežnik prebuja; stanje »ni</text><text x="824" y="845.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">podatkov« prikazati ločeno s povezavo na nalaganje.</text><rect x="80" y="931.0" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="931.0" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="943.0" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="959.0" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><rect x="174.2190625" y="943.0" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="186.2190625" y="959.0" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="992.0" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je trenutno stanje (blok, sezona) jasno označeno?</text><text x="92" y="1019.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Trenutna ura je na strani Omrežnina obkrožena, aktivna sezona in tip dneva sta</text><text x="92" y="1042.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">poudarjena.</text><text x="824" y="963.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Trenutni blok izpisati tudi z besedilom (»Zdaj velja blok 3«).</text><rect x="80" y="1071.7" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1071.7" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1083.7" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="1099.7" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="1083.7" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="1099.7" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1132.7" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem prikaže manjkajoče podatke razumljivo?</text><text x="92" y="1160.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Simulacija izpiše »zunanja temperatura je X°C«, ko vremenski podatek še ni</text><text x="92" y="1183.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">naložen ali ni na voljo.</text><text x="824" y="1103.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Prikazati »podatek o temperaturi trenutno ni na voljo« ali skeleton, dokler se</text><text x="824" y="1126.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">podatek ne naloži.</text><rect x="80" y="1212.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1212.4" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1224.4" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="1240.4" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="1224.4" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="1240.4" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1273.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem prikaže napredek pri izračunih?</text><text x="92" y="1300.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Simulacija in Razlaga računa (»Nalaganje …« kot navaden tekst) med izračunom</text><text x="92" y="1323.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">nimata vidnega indikatorja.</text><text x="824" y="1244.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Dodati skeleton ali vrtavko na mesto rezultata.</text></svg>