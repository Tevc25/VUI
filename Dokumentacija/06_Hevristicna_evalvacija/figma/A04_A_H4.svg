<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1383" viewBox="0 0 1600 1383" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H4</title><rect width="1600" height="1383" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">04</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Doslednost in standardi</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Consistency and Standards</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Uporabnik se ne sme spraševati, ali različne besede, situacije ali dejanja pomenijo isto. Upoštevati je treba konvencije platforme in industrije.</text><circle cx="86" cy="350.55" r="4" fill="#4F4FC9"/><text x="102" y="355.6" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn sledi industrijskim konvencijam?</text><circle cx="86" cy="379.75" r="4" fill="#4F4FC9"/><text x="102" y="384.8" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali so vizualni elementi uporabljeni dosledno v celotnem dizajnu?</text><rect x="80" y="415.9" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="450.9" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Vizualni slog (kartice, zaobljeni gumbi, barve) je večinoma enoten. Neenoten pa je nagovor uporabnika: na isti strani se izmenjujeta</text><text x="104" y="475.6" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">tikanje in vikanje. Kartica »Nadzorna plošča« v vodniku vodi na stran, na kateri je uporabnik že.</text><text x="80" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="547.2" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="563.2" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="577.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="589.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="589.2" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="605.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="638.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je nagovor uporabnika dosleden?</text><text x="92" y="665.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Nadzorna plošča vika (»Preglejte«), vodnik tika (»Spoznaj«); na simulaciji si sledijo</text><text x="92" y="688.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">»Izberi naprave«, »Izberite naprave« in »Preizkusi«.</text><text x="824" y="609.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izbrati en nagovor (predlagam vikanje ali dosledno tikanje) in pregledati vsa</text><text x="824" y="632.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">besedila.</text><rect x="80" y="717.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="717.9" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="729.9" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="729.9" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="745.9" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="778.9" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali se enaki elementi obnašajo enako?</text><text x="92" y="806.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Kartica »Nadzorna plošča« vodi na samo sebe (klik nima učinka), ostale kartice</text><text x="92" y="829.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">vodijo na drugo stran.</text><text x="824" y="749.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Kartico »Nadzorna plošča« odstraniti iz vodnika.</text><rect x="80" y="858.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="858.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="870.5" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="886.5" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="870.5" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="886.5" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="919.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so poimenovanja menija, naslovov in URL-jev usklajena?</text><text x="92" y="946.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Postavka »Pregled datotek« odpre stran »Upravljanje podatkov« (URL /delete-files);</text><text x="92" y="970.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">naslov skupine »Moje datoteke« ni zapisan z velikimi črkami kot ostale skupine.</text><text x="824" y="890.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uskladiti ime postavke, naslov strani in URL (npr. »Moji podatki«, /my-data) ter slog</text><text x="824" y="913.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">naslovov skupin.</text><rect x="80" y="999.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="999.2" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1011.2" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="1027.2" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="1011.2" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="207.1928125" y="1027.2" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1060.2" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je jezik vmesnika enoten?</text><text x="92" y="1087.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izbirnik datoteke pri nalaganju prikazuje brskalnikove angleške napise »Choose</text><text x="92" y="1110.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">File« in »No file chosen«.</text><text x="824" y="1031.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Uporabiti lastno komponento za izbiro datoteke s slovenskimi napisi (»Izberi</text><text x="824" y="1054.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">datoteko«, »Datoteka ni izbrana«) ali območje za povleci in spusti.</text><rect x="80" y="1139.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="1139.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="1151.8" width="62.56875" height="24.0" rx="12" fill="#FFF2CC"/><text x="104" y="1167.8" font-family="Inter" font-size="13" font-weight="700" fill="#8A5A00">Delno</text><rect x="162.56875" y="1151.8" width="88.92937500000001" height="24.0" rx="12" fill="#F1F1F5"/><text x="174.56875" y="1167.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 1</text><text x="92" y="1200.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so sporočila o napakah oblikovana enotno?</text><text x="92" y="1228.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ob manjkajoči datoteki se hkrati uporabljata »Naloži datoteko.« in »Naložite</text><text x="92" y="1251.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">datoteko.«; nekateri obrazci uporabljajo emoji ⚠️, drugi ne. Gumb se glasi »Naloži</text><text x="92" y="1274.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">csv ali excel«.</text><text x="824" y="1171.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Pripraviti enoten slovar sporočil in komponento za prikaz napak; gumb</text><text x="824" y="1195.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">preimenovati v »Naloži datoteko (CSV ali XLSX)«.</text></svg>