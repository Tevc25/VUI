<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1154" viewBox="0 0 1600 1154" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A – H2</title><rect width="1600" height="1154" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Tevž Starovasnik</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Registracija, prijava in 2FA, nadzorna plošča, nalaganje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">02</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Ujemanje med sistemom in resničnim svetom</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Match Between System and the Real World</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Dizajn naj govori jezik uporabnika: besede, fraze in koncepte, ki jih uporabnik pozna, namesto internega žargona. Sledi naj konvencijam resničnega</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">sveta in informacije prikazuje v naravnem in logičnem zaporedju.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali bo uporabnik poznal uporabljeno terminologijo?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali kontrolniki sledijo konvencijam resničnega sveta?</text><rect x="80" y="443.5" width="1440" height="114.0" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Strokovni izrazi (časovni bloki, dogovorjena moč, merilno mesto) so v slovenščini in usklajeni z izrazi na portalu mojelektro.si, kar je</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">dobro. Težave nastanejo pri poimenovanju zavihkov za nalaganje in pri priporočilu na strani Omrežnina, ki opisuje star tarifni model (VT/MT) in je v nasprotju s</text><text x="104" y="527.8" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">petimi časovnimi bloki, prikazanimi tik nad njim.</text><text x="80" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="599.5" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="615.5" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="629.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="629.5" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="641.5" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="657.5" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="690.5" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali sistem uporablja izraze, ki jih uporabnik pozna?</text><text x="92" y="717.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izrazi so povzeti po mojelektro.si in računih (dnevna stanja, 15-minutni podatki,</text><text x="92" y="740.9" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">dogovorjena moč).</text><text x="824" y="661.5" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text><rect x="80" y="770.1" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="770.1" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="782.1" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="798.1" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="782.1" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="798.1" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="831.1" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali poimenovanja možnosti ustrezajo dejanski akciji?</text><text x="92" y="858.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Zavihek »Naloži račun« ne naloži datoteke, temveč odpre obrazec za ročni vnos</text><text x="92" y="881.6" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">zneskov. Uporabnik pričakuje nalaganje PDF računa.</text><text x="824" y="802.1" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Preimenovati v »Ročni vnos računa« in vizualno ločiti od zavihkov za nalaganje</text><text x="824" y="825.3" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">datotek.</text><rect x="80" y="910.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="910.8" width="708" height="151.8" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="922.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="938.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="922.8" width="88.92937500000001" height="24.0" rx="12" fill="#FDE4DA"/><text x="207.1928125" y="938.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 3</text><text x="92" y="971.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so informacije podane v naravnem in logičnem zaporedju?</text><text x="92" y="999.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Priporočilo na strani Omrežnina svetuje rabo »med tednom od 22. do 6. ure ter ob</text><text x="92" y="1022.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">vikendih« (model VT/MT), stran pa sicer prikazuje nov sistem petih blokov.</text><text x="92" y="1045.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Informaciji si nasprotujeta.</text><text x="824" y="942.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Priporočilo prepisati v jeziku blokov (npr. »uporabljajte naprave v blokih 4 in 5, ki</text><text x="824" y="966.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">so ponoči in ob dela prostih dnevih«) in ga povezati s trenutnim blokom.</text></svg>