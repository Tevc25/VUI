<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="942" viewBox="0 0 1600 942" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>B – H6</title><rect width="1600" height="942" fill="#FFFFFF"/><rect x="0" y="0.0" width="1600" height="8.0" rx="0" fill="#4F4FC9"/><text x="80" y="56.0" font-family="Inter" font-size="16" font-weight="700" fill="#4F4FC9">HEURISTIC EVALUATION WORKBOOK · OMREŽNINA+</text><text x="80" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">OCENJEVALEC</text><text x="80" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Adam Kac</text><text x="352" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">DATUM</text><text x="352" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">13. 10. 2026</text><text x="544" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">PRODUKT</text><text x="544" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Omrežnina+ (curious-hamster-3d9d0d.netlify.app)</text><text x="1026" y="96.0" font-family="Inter" font-size="12" font-weight="600" fill="#5B5F73">NALOGA</text><text x="1026" y="121.0" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">Analitični pogledi, razlaga računa, profil, upravljanje</text><text x="1026" y="144.8" font-family="Inter" font-size="17" font-weight="500" fill="#1A1A2E">podatkov</text><rect x="80" y="160.0" width="1440" height="1.0" rx="0" fill="#D9DAE3"/><text x="80" y="248.0" font-family="Inter" font-size="64" font-weight="700" fill="#4F4FC9">06</text><text x="190" y="224.0" font-family="Inter" font-size="36" font-weight="700" fill="#1A1A2E">Prepoznavanje namesto priklica</text><text x="190" y="256.0" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Recognition Rather Than Recall</text><text x="80" y="313.0" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">Zmanjšati je treba obremenitev spomina: elementi, dejanja in možnosti naj bodo vidni. Uporabniku ni treba pomniti informacij iz enega dela</text><text x="80" y="340.6" font-family="Inter" font-size="19" font-weight="400" fill="#1A1A2E">vmesnika v drugega.</text><circle cx="86" cy="378.1" r="4" fill="#4F4FC9"/><text x="102" y="383.1" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ohranja pomembne informacije vidne, da si jih uporabnik ne rabi zapomniti?</text><circle cx="86" cy="407.3" r="4" fill="#4F4FC9"/><text x="102" y="412.3" font-family="Inter" font-size="18" font-weight="500" fill="#5B5F73">Ali dizajn ponuja pomoč v kontekstu?</text><rect x="80" y="443.5" width="1440" height="89.3" rx="12" fill="#F4F4F8"/><text x="104" y="478.5" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Povzetek ocenjevalca: Simulacija pri vsaki napravi prikaže moč, izbrane naprave so označene, Razlaga računa pa ima razlago ob vsaki postavki. Na strani</text><text x="104" y="503.1" font-family="Inter" font-size="17" font-weight="400" fill="#1A1A2E">Omrežnina krogi prikazujejo številko ure, blok pa le barva, zato mora uporabnik pomniti legendo; barvi blokov 3 in 5 sta si podobni.</text><text x="80" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">TEŽAVE (ISSUES)</text><text x="812" y="574.8" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A2E">PREDLOGI IZBOLJŠAV (RECOMMENDATIONS)</text><rect x="80" y="590.8" width="1440" height="2.0" rx="0" fill="#1A1A2E"/><rect x="80" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="604.8" width="708" height="128.7" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="616.8" width="95.1928125" height="24.0" rx="12" fill="#FBE1DC"/><text x="104" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#B4361F">Ne ustreza</text><rect x="195.1928125" y="616.8" width="88.92937500000001" height="24.0" rx="12" fill="#FFF4D6"/><text x="207.1928125" y="632.8" font-family="Inter" font-size="13" font-weight="700" fill="#1A1A2E">Resnost 2</text><text x="92" y="665.8" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali je informacija razvidna brez pomnjenja legende?</text><text x="92" y="693.0" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Krogi ur prikazujejo uro, blok je izražen samo z barvo (blok 3 #FFD900 in blok 5</text><text x="92" y="716.2" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">#B8D900 sta težko ločljiva, tudi za barvno slepe).</text><text x="824" y="636.8" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">V krog izpisati številko bloka, uro pa nad njim; uporabiti bolj ločljivo paleto.</text><rect x="80" y="745.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="812" y="745.4" width="708" height="105.5" rx="10" fill="#FFFFFF" stroke="#D9DAE3" stroke-width="1"/><rect x="92" y="757.4" width="74.2190625" height="24.0" rx="12" fill="#E3F3E8"/><text x="104" y="773.4" font-family="Inter" font-size="13" font-weight="700" fill="#2F855A">Ustreza</text><text x="92" y="806.4" font-family="Inter" font-size="15" font-weight="600" fill="#5B5F73">Ali so izbrane možnosti vidno označene?</text><text x="92" y="833.7" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Izbrane naprave v simulaciji so obarvane, aktivni zavihek profila je poudarjen.</text><text x="824" y="777.4" font-family="Inter" font-size="16" font-weight="400" fill="#1A1A2E">Ni potrebnih sprememb.</text></svg>